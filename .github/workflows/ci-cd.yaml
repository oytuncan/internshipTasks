name: Build, Push to Harbor and Update GitOps

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Short SHA as Image Tag
        run: |
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Configure Harbor Credentials
        run: |
          mkdir -p ~/.docker
          AUTH_BASE64=$(echo -n "admin:Harbor12345" | base64)
          cat <<EOF > ~/.docker/config.json
          {
            "auths": {
              "harbor.local": {
                "auth": "$AUTH_BASE64"
              }
            }
          }
          EOF

      - name: Set up Docker Buildx with Insecure Registry
        run: |
          cat <<'EOF' > /tmp/buildkitd.toml
          [registry."harbor.local"]
            http = true
            insecure = true
          EOF
          docker buildx create --use --name gitops-builder --config /tmp/buildkitd.toml || docker buildx use gitops-builder

      - name: Build and Push Docker Image to Harbor
        run: |
          docker buildx build --push -t harbor.local/wordpress/my-wordpress:${{ env.IMAGE_TAG }} .

      - name: Update Helm values.yaml with New Image Tag
        run: |
          sed -i 's|tag:.*|tag: '"${{ env.IMAGE_TAG }}"'|g' helm/values.yaml

      - name: Commit and Push Updated Manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git commit -m "chore(gitops): update image tag to ${{ env.IMAGE_TAG }} [skip ci]" || echo "No changes"
          git push origin main
