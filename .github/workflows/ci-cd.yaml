name: Build, Push to Harbor and Update GitOps

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Short SHA as Image Tag
        run: |
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Configure Harbor Docker Credentials
        run: |
          mkdir -p ~/.docker
          AUTH_B64=$(echo -n "admin:Harbor12345" | base64 | tr -d '\n')
          echo "{\"auths\":{\"harbor.local\":{\"auth\":\"$AUTH_B64\"}}}" > ~/.docker/config.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."harbor.local"]
              http = true
              insecure = true

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: harbor.local/wordpress/my-wordpress:${{ env.IMAGE_TAG }}

      - name: Update Helm values.yaml with New Image Tag
        run: |
          sed -i 's|tag:.*|tag: '"${{ env.IMAGE_TAG }}"'|g' helm/values.yaml

      - name: Commit and Push Updated Manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git commit -m "chore(gitops): update image tag to ${{ env.IMAGE_TAG }} [skip ci]" || echo "No changes"
          git push origin main
